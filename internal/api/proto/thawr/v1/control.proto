syntax = "proto3";

package thawr.v1;

option go_package = "github.com/thedatadudech/thawr/internal/api/proto/thawr/v1;thawrv1";

// Control is the client-to-server control channel. Every RPC except
// Enroll carries the node secret as "authorization: Bearer <secret>".
service Control {
  // Enroll registers a new agent peer with a one-time token.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Sync streams the caller's netmap: a full map on connect, a full map
  // on every change affecting the caller, and a keepalive map every 30 s.
  rpc Sync(SyncRequest) returns (stream NetMap);
  // ReportEndpoints replaces the caller's endpoint candidates.
  rpc ReportEndpoints(EndpointReport) returns (Empty);
  // ReportPath records the caller's path state per peer for status.
  rpc ReportPath(PathReport) returns (Empty);
  // RotateKey replaces the caller's WireGuard public key.
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);
  // Leave removes the caller from the network.
  rpc Leave(Empty) returns (Empty);
  // SetLock installs a lock record (spec 012). The first record is
  // accepted as is; later ones must carry a higher generation and a
  // signature by a key of the current record.
  rpc SetLock(SetLockRequest) returns (Empty);
  // SignPeer stores a signer's signature over a peer's current record.
  rpc SignPeer(SignPeerRequest) returns (Empty);
  // ListLockPeers lists every peer with its signing state. Only a peer
  // named as signer in the current lock record may call it.
  rpc ListLockPeers(Empty) returns (LockPeers);
  // AdvertiseRoutes replaces the caller's advertised prefixes (spec
  // 013); the reply lists them with their approval state.
  rpc AdvertiseRoutes(AdvertiseRoutesRequest) returns (AdvertisedRoutes);
}

// EnrollRequest carries the token and the client's identity.
message EnrollRequest {
  // token is the one-time enrollment secret (thawr_...).
  string token = 1;
  // public_key is the client's WireGuard public key, base64.
  string public_key = 2;
  string hostname = 3;
  string os = 4;
  string arch = 5;
  string client_version = 6;
  // name optionally requests a peer name; the token's name or the
  // hostname is used otherwise.
  string name = 7;
}

// EnrollResponse is returned once; node_secret is never shown again.
message EnrollResponse {
  string peer_id = 1;
  string name = 2;
  string ipv4 = 3;
  string overlay_cidr = 4;
  string node_secret = 5;
  string hub_public_key = 6;
  string hub_endpoint = 7;
  string server_version = 8;
  int64 netmap_generation = 9;
}

// SyncRequest opens the netmap stream. generation is informational: the
// server always sends a full map first.
message SyncRequest {
  int64 generation = 1;
  string client_version = 2;
  // lock_key is the caller's lock public key when it has one, so a
  // signer can add this device with lock add-signer.
  string lock_key = 3;
}

// NetMap is one peer's complete view of the network.
message NetMap {
  int64 generation = 1;
  SelfInfo self = 2;
  repeated NetPeer peers = 3;
  HubPeer hub = 4;
  repeated FilterRule filter = 5;
  // keepalive marks a periodic resend with no change.
  bool keepalive = 6;
  // server_version is the version string of the server that built it.
  string server_version = 7;
  // lock is the current lock record with its signature; absent while
  // no record was ever set.
  SignedLockRecord lock = 8;
  // forward lists the rules the receiver installs on its forwarding
  // path as a subnet router or exit node (spec 013).
  repeated ForwardRule forward = 9;
}

// SelfInfo describes the receiving peer.
message SelfInfo {
  string id = 1;
  string name = 2;
  string ipv4 = 3;
  string overlay_cidr = 4;
  // stun_addrs are the server's STUN listeners as host:port (one or two).
  repeated string stun_addrs = 5;
  // kind is the receiving peer's kind (human, server, agent).
  string kind = 6;
  // signatures are the lock signatures over the receiver's own current
  // record, so it can tell whether it is signed (spec 012).
  repeated PeerSignature signatures = 7;
  // advertised lists the prefixes the receiver advertises as the server
  // knows them, with their approval (spec 013).
  repeated AdvertisedRoute advertised = 8;
}

// NetPeer is one visible peer.
message NetPeer {
  string id = 1;
  string name = 2;
  string kind = 3;
  string public_key = 4;
  string ipv4 = 5;
  bool online = 6;
  repeated Endpoint endpoints = 7;
  bool symmetric = 8;
  // keepalive asks the receiver to send persistent keepalives to this peer.
  bool keepalive = 9;
  // allowed_ips lists extra prefixes routed to this peer besides its /32.
  repeated string allowed_ips = 10;
  // owner is the owning user's name; empty for unowned peers.
  string owner = 11;
  // via_hub marks a static (mobile) peer reached through the hub: the
  // receiver adds no WireGuard peer for it, the hub routes its /32.
  bool via_hub = 12;
  // signatures are lock signatures over this peer's current record.
  repeated PeerSignature signatures = 13;
  // exit_node marks a peer the receiver may route its internet traffic
  // through; the receiver adds 0.0.0.0/0 only when it selects it.
  bool exit_node = 14;
}

// EndpointKind classifies a candidate address.
enum EndpointKind {
  ENDPOINT_KIND_UNSPECIFIED = 0;
  ENDPOINT_KIND_LOCAL = 1;
  ENDPOINT_KIND_REFLEXIVE = 2;
  ENDPOINT_KIND_STABLE = 3;
}

// Endpoint is one ip:port candidate.
message Endpoint {
  string addr = 1;
  EndpointKind kind = 2;
}

// HubPeer is the server's own WireGuard interface as seen by a peer.
message HubPeer {
  string public_key = 1;
  string endpoint = 2;
  repeated string allowed_ips = 3;
  // signatures are lock signatures over the hub's record.
  repeated PeerSignature signatures = 4;
}

// PeerSignature is one lock key's signature over a peer record.
message PeerSignature {
  // signer_key is the lock public key, base64.
  string signer_key = 1;
  // signature is the Ed25519 signature, base64.
  string signature = 2;
}

// LockSigner is one device allowed to sign peer records.
message LockSigner {
  string key = 1;
  string peer_id = 2;
}

// LockRecord is the trusted signer set (spec 012).
message LockRecord {
  uint64 generation = 1;
  bool disabled = 2;
  repeated LockSigner signers = 3;
}

// SignedLockRecord is a record with the signature of a lock key.
message SignedLockRecord {
  LockRecord record = 1;
  string signature = 2;
}

// SetLockRequest carries the record to install.
message SetLockRequest {
  SignedLockRecord lock = 1;
  // signatures are applied in the same transaction as the record, so
  // enabling the lock never shows other devices a record without the
  // signatures that go with it (lock init).
  repeated SignPeerRequest signatures = 2;
}

// SignPeerRequest carries a signature over one peer's current record.
message SignPeerRequest {
  // peer_id is a peer id or "hub".
  string peer_id = 1;
  // public_key is the WireGuard key the signature covers.
  string public_key = 2;
  string signer_key = 3;
  string signature = 4;
}

// LockPeers answers ListLockPeers.
message LockPeers {
  repeated LockPeer peers = 1;
  LockPeer hub = 2;
}

// LockPeer is one peer as a signer sees it.
message LockPeer {
  string id = 1;
  string name = 2;
  string public_key = 3;
  // signed reports whether the current key carries a valid signature.
  bool signed = 4;
  // lock_key is the lock public key the peer reported, if any.
  string lock_key = 5;
  string kind = 6;
}

// FilterRule allows src_ipv4 to reach the receiver on a port range.
// Empty filter means allow everything from visible peers (until spec 006).
message FilterRule {
  string src_ipv4 = 1;
  string proto = 2;
  uint32 port_lo = 3;
  uint32 port_hi = 4;
}

// ForwardRule allows src_ipv4 to reach dst_cidr through the receiver on
// a port range (spec 013).
message ForwardRule {
  string src_ipv4 = 1;
  string dst_cidr = 2;
  string proto = 3;
  uint32 port_lo = 4;
  uint32 port_hi = 5;
}

// AdvertiseRoutesRequest carries the caller's complete advertised set;
// an empty list withdraws everything.
message AdvertiseRoutesRequest {
  repeated string prefixes = 1;
}

// AdvertisedRoutes lists a peer's advertised prefixes.
message AdvertisedRoutes {
  repeated AdvertisedRoute routes = 1;
}

// AdvertisedRoute is one advertised prefix and whether an admin
// approved it.
message AdvertisedRoute {
  string prefix = 1;
  bool approved = 2;
}

// EndpointReport replaces the caller's candidates.
message EndpointReport {
  repeated Endpoint endpoints = 1;
  bool symmetric = 2;
  uint32 listen_port = 3;
}

// PathReport records how the caller currently reaches each peer.
message PathReport {
  repeated PathState paths = 1;
}

// PathState is one peer's path from the caller's view.
message PathState {
  string peer_id = 1;
  // state is direct, relay, probing, idle, unreachable or hub.
  string state = 2;
  string endpoint = 3;
}

// RotateKeyRequest carries the new public key; the old one stays valid
// until the next netmap is delivered.
message RotateKeyRequest {
  string new_public_key = 1;
  // signer_key and signature let a signer vouch for its own new key in
  // the same call (spec 012); both optional.
  string signer_key = 2;
  string signature = 3;
}

// RotateKeyResponse reports the generation carrying the new key.
message RotateKeyResponse {
  int64 generation = 1;
}

// Empty is the empty message.
message Empty {}
