# Thawr server configuration.
# Only `public_addr` is required; every other key is shown with its default.
# Spec: docs/specs/001-server-bootstrap.md

public_addr: vpn.example.com     # host or host:port that peers can reach
data_dir: /var/lib/thawr         # SQLite DB, WireGuard key, TLS files, admin socket

listen:
  https: ":443"                  # gRPC + REST + admin UI + relay
  stun: [":3478", ":3479"]       # two ports so clients can detect symmetric NAT
  wireguard: ":51820"            # server's own WireGuard interface (hub)

overlay:
  cidr: 100.64.0.0/10
  interface: thawr0              # macOS: utun (the kernel picks the number)
  ipv6: ""                       # unique local /64 (fd00::/8); empty: generated on first start and kept

tls:
  mode: self-signed              # self-signed | file | acme
  cert_file: ""                  # with mode: file
  key_file: ""                   # with mode: file
  email: ""                      # with mode: acme (required): the CA account contact
  domain: ""                     # with mode: acme: default the host of public_addr; a DNS name
  acme_directory: ""             # with mode: acme: CA directory URL; empty is Let's Encrypt

policy_file: /etc/thawr/policy.yaml   # YAML ACLs, default deny when absent
admin_socket: /var/lib/thawr/admin.sock

log:
  level: info                    # debug | info | warn | error
  format: text                   # text | json

min_client_version: ""           # default: the server's own major.minor

relay:
  max_bytes_per_second: 0        # per-peer relay rate limit; 0 = unlimited

dns:
  enabled: true                  # <name>.thawr resolver on the hub address, port 53 (phones ask it)
  upstream: []                   # forwarders for other names; default: this host's /etc/resolv.conf

audit:
  retention_days: 90             # audit log entries older than this are pruned daily; 0 keeps everything
metrics:
  listen: ""                     # host:port of a plain-HTTP /metrics listener, e.g. 127.0.0.1:9469; empty is off.
                                 # /metrics is always on the admin socket. No authentication: keep it on loopback.
