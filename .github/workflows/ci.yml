name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build
        run: go build -trimpath ./...
      - name: test
        env:
          CGO_ENABLED: "1" # race runtime needs cgo; the binary stays CGO_ENABLED=0
        run: go test -race -count=1 ./...

  # The netns integration suite (`make integration`) and the nftables
  # tests in internal/wg: server, clients and NATs in network namespaces
  # with the real binary. They need root and the tools below; GitHub's
  # Linux runners have the WireGuard module, IPv6, systemd and
  # passwordless sudo, so nothing skips for want of the host.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The tests run as root; keep the checkout token off the disk.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            iproute2 iputils-ping nftables conntrack netcat-openbsd wireguard-tools iperf3
      - name: integration
        env:
          CGO_ENABLED: "1" # race runtime needs cgo; the binary under test stays CGO_ENABLED=0
        run: sudo -E env "PATH=$PATH" go test -race -count=1 -v -tags integration -timeout 25m ./tests/... ./internal/wg/...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/thawr

  # Two release builds of two targets must be byte-identical; the same
  # check runs before every published release.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make release-verify

  # Scans with the newest stable toolchain: standard-library findings
  # depend on the Go version that builds the binary, and releases are
  # built with the latest patch release.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The pages workflow rewrites site/index.html after every release; this
  # fails a page edit that would break that rewrite.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/site-release-test.sh
