name: release

# Builds the release archives from a tag, checks that the build is
# reproducible and publishes a GitHub Release with SHA256SUMS. Started
# by pushing a tag, or by hand with a version: then the tag is created
# on the built commit by the release itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0-rc1; the tag is created on the default branch"
        required: true
        type: string

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: test
        env:
          CGO_ENABLED: "1" # race runtime needs cgo; the binary stays CGO_ENABLED=0
        run: go test -race -count=1 ./...

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: refuse to re-release an existing tag by hand
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION exists; pushing it is what releases it" >&2
            exit 1
          fi
      - name: build archives
        run: make release VERSION="$VERSION"
      - name: verify reproducibility
        run: make release-verify VERIFY_VERSION="$VERSION"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A release published by hand for this tag (GitHub's "new release"
        # page creates the tag) gets the archives attached; otherwise the
        # workflow creates the release, and with it the tag on the commit
        # that was built when started by hand. The release notes are the
        # CHANGELOG.md section for the version when there is one, else
        # GitHub's generated notes.
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease";; esac
            notes=""
            awk -v v="${VERSION#v}" '
              /^## \[/ { p = index($0, "[" v "]") > 0 }
              p { print }
            ' CHANGELOG.md > notes.md
            if [ -s notes.md ]; then notes="--notes-file notes.md"; else notes="--generate-notes"; fi
            gh release create "$VERSION" dist/* --title "$VERSION" $notes --target "$GITHUB_SHA" $prerelease
          fi
